<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Аналіз подібності текстів</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <h1>AI-система виявлення плагіату</h1>
  <p class="sub">Порівняння документів за допомогою TF-IDF та косинусної міри подібності</p>

  <div class="file-section">

    <input type="file" id="fileInput" multiple accept=".txt,.docx" hidden />

    <div class="buttons">
      <button onclick="document.getElementById('fileInput').click()">
        Додати файли (.txt / .docx)
      </button>
    </div>

    <p class="info">Мінімум 2 документи для аналізу. Підтримуються формати .txt та .docx</p>

  </div>

  <div class="grid">

    <textarea id="d1" placeholder="Документ 1"></textarea>
    <textarea id="d2" placeholder="Документ 2"></textarea>
    <textarea id="d3" placeholder="Документ 3"></textarea>

  </div>

  <div class="buttons">

    <button onclick="run()">Порівняти документи</button>
    <button onclick="exportReport()">Експортувати звіт</button>
    <button onclick="clearAll()">Очистити все</button>

  </div>

  <div id="result" class="result"></div>

</div>

<div id="modal" class="modal hidden">
  <div class="modal-content">
    <p>Уведіть мінімум 2 документи для аналізу</p>
    <button onclick="closeModal()">OK</button>
  </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
