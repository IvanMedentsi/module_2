<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Аналіз подібності текстів</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <h1>TF-IDF аналіз подібності текстів</h1>
  <p class="sub">Порівняння документів за допомогою косинусної міри подібності</p>

  <div class="grid">

    <textarea id="d1" placeholder="Документ 1"></textarea>
    <textarea id="d2" placeholder="Документ 2"></textarea>
    <textarea id="d3" placeholder="Документ 3"></textarea>

  </div>

  <div class="buttons">

    <button onclick="run()">Порівняти документи</button>
    <button onclick="exportReport()">Експортувати звіт</button>

  </div>

  <div id="result" class="result"></div>

</div>

<div id="modal" class="modal hidden">
  <div class="modal-content">
    <p>Уведіть мінімум 2 документи для аналізу</p>
    <button onclick="closeModal()">OK</button>
  </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
